name: Build APK

on:
  push:
    tags:
      - 'v*'  # Dispara quando fizer push de uma tag tipo v1.0.0, v2.1.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prepare www directory
        run: |
          mkdir -p www
          cp index.html www/
          cp -r src www/

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@6

      - name: Sync Capacitor
        run: npx cap sync

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brick-classico-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Brick Clássico ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
